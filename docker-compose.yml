# Studio Manager - complete application
#
#   Everything (production-like):   docker compose up -d --build      -> http://localhost:8080
#   Only the database (development): docker compose up -d db
#   Database browser (pgAdmin):       http://localhost:5050
#
# The database and pgAdmin are only reachable from this computer (127.0.0.1), never from the network.
#
# Passwords below are defaults for local use. On a real server put them into a .env file (see .env.example).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studio}
    ports:
      # 5433 on the host, so it does not clash with a locally installed PostgreSQL
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src
      dockerfile: StudioManager.API/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__StudioDatabase: "Host=db;Port=5432;Database=studio;Username=studio;Password=${DB_PASSWORD:-studio}"
      FileStorage__RootPath: /data/files
      OwnerAccount__Email: ${OWNER_EMAIL:-owner@studio.local}
      OwnerAccount__Password: ${OWNER_PASSWORD:-scumlight}
      OwnerAccount__DisplayName: ${OWNER_NAME:-Studio Owner}
    volumes:
      - studio-files:/data/files

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # WEB_PORT in .env if 8080 is already taken (e.g. on a server)
      - "${WEB_PORT:-8080}:80"

  # Look into the database in the browser. Login with PGADMIN_EMAIL / PGADMIN_PASSWORD,
  # the server "Studio Manager" is already registered (database password = DB_PASSWORD).
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@scumlight.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-scumlight}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  db-data:
  studio-files:
  pgadmin-data:
