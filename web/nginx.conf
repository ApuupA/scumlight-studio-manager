server {
    listen 80;
    root /usr/share/nginx/html;

    # Photo uploads (later: mixes - raise this then)
    client_max_body_size 20m;

    # API requests go to the ASP.NET Core container (same origin -> the login cookie just works)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single page app: every unknown path is handled by React Router in index.html
    location / {
        try_files $uri /index.html;
    }
}
