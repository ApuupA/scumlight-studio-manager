# "https" from an HTTPS proxy in front of this container (on the server) is passed on,
# otherwise our own scheme (http) is used - the API marks the login cookie "Secure" for https
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Photo uploads (later: mixes - raise this then)
    client_max_body_size 20m;

    # API requests go to the ASP.NET Core container (same origin -> the login cookie just works)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Single page app: every unknown path is handled by React Router in index.html
    location / {
        try_files $uri /index.html;
    }

    # index.html: the browser must always ask for the newest one - otherwise it keeps showing
    # the old version after an update (until Ctrl+F5)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The program files have a hash in their name (index-Boc8J8C0.js) - a new version gets new names,
    # so the browser may keep these as long as it likes
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
